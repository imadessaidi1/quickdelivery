server:
  port: ${API_GATEWAY_PORT:8443}
  ssl:
    enabled: true
    key-store: ${API_GATEWAY_SSL_KEY_STORE:file:./certs/quickdelivery-dev.p12}
    key-store-password: ${API_GATEWAY_SSL_KEY_STORE_PASSWORD:QuickDelivery123@}
    key-store-type: PKCS12
    key-alias: ${API_GATEWAY_SSL_KEY_ALIAS:quickdelivery-dev}

spring:
  main:
    web-application-type: reactive
  application:
    name: APIGatewayApplication
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:https://localhost:18443/auth/realms/quickdelivery}
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway-Token, ${quickdelivery.gateway.internal-token}
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "https://localhost"
              - "http://localhost:*"
              - "https://localhost:*"
              - "http://*:*"
              - "https://*:*"
              - "capacitor://localhost"
              - "ionic://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: users-service
          uri: ${USERS_SERVICE_URI:http://users-service:8081}
          predicates:
            - Path=/users/v1/**
        - id: packages-service
          uri: ${PACKAGES_SERVICE_URI:http://packages-service:8082}
          predicates:
            - Path=/packages/v1/**
        - id: packages-websocket
          uri: ${PACKAGES_WS_URI:ws://packages-service:8082}
          predicates:
            - Path=/ws/**
        - id: IAMService
          uri: ${IAM_SERVICE_URI:lb://IAM-SERVICES}
          predicates:
            - Path=/IAM/v1/**
          filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
            - name: CircuitBreaker
              args:
                name: IAMService
                fallbackUri: forward:/fallback/testService
    loadbalancer:
      ribbon:
        MaxAutoRetries: 2
        MaxAutoRetriesNextServer: 2
        OkToRetryOnAllOperations: true
        OkRetryOnConnectionErrors: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:admin@localhost:8080/eureka/}

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 2s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.io.IOException
      ignoreExceptions:
        - java.lang.IllegalStateException
    shared:
      slidingWindowSize: 100
      permittedNumberOfCallsInHalfOpenState: 30
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      ignoreExceptions:
        - java.lang.IllegalStateException
  instances:
    backendA:
      baseConfig: default
    backendB:
      slidingWindowSize: 10
      minimumNumberOfCalls: 10
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

quickdelivery:
  frontend:
    base-urls: ${QUICKDELIVERY_FRONTEND_BASE_URLS:}
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN:quickdelivery-internal-token}
  security:
    additional-issuer-uris: ${QUICKDELIVERY_AUTH_ISSUER_URIS:}
