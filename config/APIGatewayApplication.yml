server:
  port: ${API_GATEWAY_PORT:8443}
  ssl:
    enabled: true
    key-store: ${API_GATEWAY_SSL_KEY_STORE:file:./certs/quickdelivery-dev.p12}
    key-store-password: ${API_GATEWAY_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: ${API_GATEWAY_SSL_KEY_ALIAS:quickdelivery-dev}

spring:
  main:
    web-application-type: reactive
  application:
    name: APIGatewayApplication
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:https://localhost:18443/auth/realms/quickdelivery}
  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: ${QUICKDELIVERY_GATEWAY_LOADBALANCER_CACHE_SPEC:initialCapacity=32,maximumSize=256,expireAfterWrite=30s}
      ribbon:
        MaxAutoRetries: 2
        MaxAutoRetriesNextServer: 2
        OkToRetryOnAllOperations: true
        OkRetryOnConnectionErrors: true
    gateway:
      httpclient:
        connect-timeout: ${QUICKDELIVERY_GATEWAY_CONNECT_TIMEOUT_MILLIS:5000}
        response-timeout: ${QUICKDELIVERY_GATEWAY_RESPONSE_TIMEOUT:15s}
        pool:
          type: elastic
          max-idle-time: ${QUICKDELIVERY_GATEWAY_MAX_IDLE_TIME:30s}
          max-life-time: ${QUICKDELIVERY_GATEWAY_MAX_LIFE_TIME:120s}
      default-filters:
        - AddRequestHeader=X-Gateway-Token, ${quickdelivery.gateway.internal-token}
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${QUICKDELIVERY_FRONTEND_BASE_URL:https://app.quickdelivery.fr}
              - ${QUICKDELIVERY_FRONTEND_LOCAL_HTTP_URL:http://localhost}
              - ${QUICKDELIVERY_FRONTEND_LOCAL_HTTPS_URL:https://localhost}
              - ${QUICKDELIVERY_FRONTEND_LOCAL_HTTP_ALT_URL:http://localhost:8080}
              - ${QUICKDELIVERY_FRONTEND_LOCAL_HTTPS_ALT_URL:https://localhost:8080}
              - "capacitor://localhost"
              - "ionic://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
              - Origin
              - X-Captcha-Token
            allowCredentials: true
      routes:
        - id: packages-stateful-service
          uri: ${PACKAGES_STATEFUL_URI:http://packages-service:8082}
          predicates:
            - Path=/packages/v1/tracking/**,/packages/v1/reserve,/packages/v1/reserve-batch,/packages/v1/pickup,/packages/v1/deliver,/packages/v1/checkOTPForPickup,/packages/v1/checkOTPForDelivery,/packages/v1/checkGuestOTPForPickup,/packages/v1/checkGuestOTPForDelivery,/packages/v1/delivery-context,/packages/v1/getPackagesByDeliveryPerson,/packages/v1/isUserWithOngoingDelivery
        - id: users-service
          uri: ${USERS_SERVICE_URI:lb://users-service}
          predicates:
            - Path=/users/v1/**
        - id: packages-service
          uri: ${PACKAGES_SERVICE_URI:lb://package-service}
          predicates:
            - Path=/packages/v1/**
        - id: packages-websocket
          uri: ${PACKAGES_WS_URI:ws://packages-service:8082}
          predicates:
            - Path=/ws/**
        - id: IAMService
          uri: ${IAM_SERVICE_URI:lb://IAM-SERVICES}
          predicates:
            - Path=/IAM/v1/**
          filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
            - name: CircuitBreaker
              args:
                name: IAMService
                fallbackUri: forward:/fallback/testService

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8080/eureka/}

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 2s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.io.IOException
      ignoreExceptions:
        - java.lang.IllegalStateException
    shared:
      slidingWindowSize: 100
      permittedNumberOfCallsInHalfOpenState: 30
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      ignoreExceptions:
        - java.lang.IllegalStateException
  instances:
    backendA:
      baseConfig: default
    backendB:
      slidingWindowSize: 10
      minimumNumberOfCalls: 10
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

quickdelivery:
  frontend:
    base-urls: ${QUICKDELIVERY_FRONTEND_BASE_URLS:}
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN}
  config-server:
    base-url: ${CONFIG_SERVER_URL:}
  discovery-server:
    base-url: ${DISCOVERY_SERVER_URL:}
  oauth-server:
    base-url: ${KEYCLOAK_INTERNAL_URL:}
  redis:
    host: ${REDIS_HOST:}
    port: ${REDIS_PORT:6379}
  mysql:
    host: ${MYSQL_HOST:}
    port: ${MYSQL_PORT:3306}
  security:
    additional-issuer-uris: ${QUICKDELIVERY_AUTH_ISSUER_URIS:}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
