services:
  redis:
    image: redis:7.4-alpine
    container_name: quickdelivery-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  config-server:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.runtime-jar
      args:
        JAR_FILE: artifacts/quickdelivery-config-server.jar
    container_name: quickdelivery-config-server
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/workspace/config
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://127.0.0.1:8080/eureka/
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      JAVA_TOOL_OPTIONS: ${CONFIG_SERVER_JAVA_TOOL_OPTIONS}
    volumes:
      - ../../../config:/workspace/config:ro
    ports:
      - "8889:8889"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8889/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  discovery-server:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.runtime-jar
      args:
        JAR_FILE: artifacts/quickdelivery-registry-server.jar
    container_name: quickdelivery-discovery-server
    environment:
      SPRING_APPLICATION_NAME: DISCOVERY-SERVER
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8889
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://127.0.0.1:8080/eureka/
      JAVA_TOOL_OPTIONS: ${DISCOVERY_SERVER_JAVA_TOOL_OPTIONS}
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    ports:
      - "8080:8080"
    restart: unless-stopped

  oauth-authorization-server:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.runtime-jar
      args:
        JAR_FILE: artifacts/oauth-authorization-server.jar
    container_name: quickdelivery-oauth-server
    environment:
      SPRING_APPLICATION_NAME: oauth-authorization-server
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8889
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      SERVER_SSL_ENABLED: "false"
      OAUTH_DB_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${KEYCLOAK_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      OAUTH_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      OAUTH_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_FRONTEND_URL: https://${AUTH_DOMAIN}/auth
      KEYCLOAK_ADMIN_URL: https://${AUTH_DOMAIN}/auth
      KEYCLOAK_FORCE_BACKEND_TO_FRONTEND_URL: "true"
      QUICKDELIVERY_FRONTEND_BASE_URLS: ${QUICKDELIVERY_FRONTEND_BASE_URLS}
      JAVA_TOOL_OPTIONS: ${OAUTH_SERVER_JAVA_TOOL_OPTIONS}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:18443/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 90s
    ports:
      - "18443:18443"
    restart: unless-stopped

volumes:
  redis-data:
