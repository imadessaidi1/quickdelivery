<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickDelivery</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f4f6fb;margin:0;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:640px;background:#ffffff;border-radius:16px;overflow:hidden;">
                <tr>
                    <td style="background:#0f2d52;padding:24px 32px;">
                        <div style="font-size:26px;font-weight:700;color:#ffffff;letter-spacing:0.4px;">QuickDelivery</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 12px;font-size:16px;" th:text="|#{email.greeting} ${recipientName},|">Hello John,</p>
                        <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;color:#0f2d52;" th:text="#{email.account.approved.title}">Your account is approved</h1>
                        <p style="margin:0 0 24px;font-size:15px;line-height:1.7;" th:text="#{email.account.approved.message}">
                            Your delivery account has been approved. You can now discover QuickDelivery.
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                            <tr>
                                <td style="border-radius:10px;background:#ff7a00;">
                                    <a th:href="${landingLink}" href="#" style="display:inline-block;padding:14px 22px;color:#ffffff;text-decoration:none;font-weight:700;" th:text="#{email.account.approved.cta}">
                                        Open QuickDelivery
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0;font-size:14px;line-height:1.6;color:#5d6a7f;" th:text="#{email.account.approved.footer}">
                            Thank you for joining QuickDelivery.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background:#f8fafc;color:#5d6a7f;font-size:13px;line-height:1.5;">
                        <div th:text="#{email.signature}">The QuickDelivery team</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
