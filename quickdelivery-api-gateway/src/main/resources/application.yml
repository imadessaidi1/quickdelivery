server:
  port: 8087

spring:
  main:
    web-application-type: reactive
  application:
    name: APIGatewayApplication
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway-Token, ${quickdelivery.gateway.internal-token}
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8080"
              - "http://localhost:8084"
              - "https://localhost:8080"
              - "https://localhost:8084"
              - "https://quickdelivery.com:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: users-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/v1/**
        - id: packages-service
          uri: http://localhost:8082
          predicates:
            - Path=/packages/v1/**
        - id: packages-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**
        - id: IAMService
          uri: lb://IAM-SERVICES
          predicates:
            - Path=/IAM/v1/**
          filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
            - name: CircuitBreaker
              args:
                name: IAMService
                fallbackUri: forward:/fallback/testService
    loadbalancer:
      ribbon:
        MaxAutoRetries: 2
        MaxAutoRetriesNextServer: 2
        OkToRetryOnAllOperations: true
        OkRetryOnConnectionErrors: true
        #enabled: false


eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:admin@localhost:8080/eureka/


resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 2s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.io.IOException
      ignoreExceptions:
        - java.lang.IllegalStateException
    shared:
      slidingWindowSize: 100
      permittedNumberOfCallsInHalfOpenState: 30
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      ignoreExceptions:
        - java.lang.IllegalStateException
  instances:
    backendA:
      baseConfig: default
    backendB:
      slidingWindowSize: 10
      minimumNumberOfCalls: 10
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 1s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

quickdelivery:
  gateway:
    internal-token: quickdelivery-internal-token
