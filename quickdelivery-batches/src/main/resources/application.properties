spring.application.name=batches-service
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://172.26.4.12:8889}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:configuser}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:configpass}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
spring.jpa.open-in-view=false
spring.datasource.hikari.pool-name=${BATCHES_DB_POOL_NAME:batches-hikari}
spring.datasource.hikari.minimum-idle=${BATCHES_DB_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${BATCHES_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${BATCHES_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${BATCHES_DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${BATCHES_DB_MAX_LIFETIME_MS:1500000}
