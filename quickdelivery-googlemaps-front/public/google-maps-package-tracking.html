<html>
  <head>
    <title>Packages Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script>
      let map;
      let routeLibrary;
      let arrivalAddress;
      let departureAddress;
      let package_;
      let markers = [];
      let routeInfo;
      let mapReady = false;
      let pendingPackageData = null;
      let pendingPosition = null;
      let AdvancedMarkerElement;
      let activeRoutePolyline = null;

      async function initMap() {
        const markerLibrary = await google.maps.importLibrary('marker');
        routeLibrary = await google.maps.importLibrary('routes');
        AdvancedMarkerElement = markerLibrary.AdvancedMarkerElement;
        map = new google.maps.Map(document.getElementById('map'), {
          zoom: 13,
          disableDefaultUI: true,
          zoomControl: true,
          scaleControl: true,
          mapId: 'PACKAGE_TRACKING',
        });

        const transitLayer = new google.maps.TransitLayer();
        transitLayer.setMap(map);
        mapReady = true;
        if (pendingPackageData) {
          const queuedPackage = pendingPackageData;
          pendingPackageData = null;
          renderTrackingPackage(queuedPackage);
        }
        if (pendingPosition && arrivalAddress) {
          const queuedPosition = pendingPosition;
          pendingPosition = null;
          updateTrackedPosition(queuedPosition);
        }
      }
      function clearRenderedRoute() {
        if (activeRoutePolyline) {
          activeRoutePolyline.setMap(null);
          activeRoutePolyline = null;
        }
      }

      function renderRoute(route) {
        clearRenderedRoute();
        if (!route?.path) {
          return;
        }

        activeRoutePolyline = new google.maps.Polyline({
          path: route.path,
          strokeColor: '#525CEB',
          strokeOpacity: 1,
          strokeWeight: 5,
          map,
        });
      }

      async function computeDrivingRoute(start, end) {
        const { Route } = routeLibrary || await google.maps.importLibrary('routes');
        const result = await Route.computeRoutes({
          origin: start,
          destination: end,
          travelMode: 'DRIVING',
          fields: ['path', 'distanceMeters', 'durationMillis'],
        });
        return result.routes?.[0] || null;
      }

      function buildAddress(address) {
        return {
          packageID: package_.id,
          line1: address.line1,
          line2: address.line2,
          zipCode: address.zipCode,
          town: address.town,
          lat: Number(address.latitude),
          lng: Number(address.longitude),
        };
      }

      function resolveInitialLocation() {
        if (package_.lastPositionLatitude && package_.lastPositionLongitude) {
          departureAddress = {
            lat: Number(package_.lastPositionLatitude),
            lng: Number(package_.lastPositionLongitude),
          };
          return new google.maps.LatLng(departureAddress.lat, departureAddress.lng);
        }

        return new google.maps.LatLng(departureAddress.lat, departureAddress.lng);
      }

      function renderTrackingPackage(packageData) {
        if (!packageData || !Array.isArray(packageData.addresses)) {
          return;
        }

        if (!mapReady) {
          pendingPackageData = packageData;
          window.top.postMessage('StartLoading', '*');
          return;
        }

        try {
          window.top.postMessage('StartLoading', '*');
          package_ = packageData;
          arrivalAddress = null;
          departureAddress = null;

          package_.addresses.forEach((address) => {
            if (address.type === 'ARRIVAL') {
              arrivalAddress = buildAddress(address);
            } else if (address.type === 'DEPARTURE') {
              departureAddress = buildAddress(address);
            }
          });

          if (!arrivalAddress || !departureAddress) {
            throw new Error('Missing tracking addresses');
          }

          map.setCenter(resolveInitialLocation());
          removeAllMarkers();
          addMarker(departureAddress, 'package', map);
          addMarker(arrivalAddress, 'destination', map);
          calculateAndDisplayRouteForPackage(null, null, departureAddress, arrivalAddress);
        } catch (error) {
          console.error(error);
          window.top.postMessage('TrackingError', '*');
          window.top.postMessage('EndLoading', '*');
        }
      }

      function updateTrackedPosition(newPosition) {
        if (!map || !arrivalAddress) {
          pendingPosition = newPosition;
          return;
        }

        departureAddress = { lat: Number(newPosition.latitude), lng: Number(newPosition.longitude) };
        removeAllMarkers();
        addMarker(departureAddress, 'package', map);
        addMarker(arrivalAddress, 'destination', map);
        calculateAndDisplayRouteForPackage(null, null, departureAddress, arrivalAddress);
      }

      function calculateAndDisplayRouteForPackage(directionsService, directionsRenderer, packageStart, packageEnd) {
        computeDrivingRoute(packageStart, packageEnd)
          .then((response) => {
            if (!response) {
              throw new Error('No route returned');
            }
            renderRoute(response);
            routeInfo = {
              distance: { value: response.distanceMeters, text: `${Math.max(1, Math.round(response.distanceMeters / 1000))} km` },
              duration: { value: response.durationMillis, text: `${Math.max(1, Math.round(response.durationMillis / 60000))} min` },
            };
            window.top.postMessage('RouteInfo;' + JSON.stringify(routeInfo), '*');
            window.top.postMessage('EndLoading', '*');
          })
          .catch((error) => {
            console.error('Route request failed', error);
            window.top.postMessage('TrackingError', '*');
            window.top.postMessage('EndLoading', '*');
          });
      }

      function buildTrackingMarkerContent(kind) {
        const marker = document.createElement('div');
        marker.className = 'tracking-marker tracking-marker-' + kind;

        const glyph = document.createElement('div');
        glyph.className = 'tracking-marker-glyph';
        glyph.innerHTML = kind === 'destination'
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 6v10a1 1 0 0 1-1 1h-4v-6H10v6H6a1 1 0 0 1-1-1V9l7-6z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5L12 4l8 3.5-8 3.5-8-3.5zm2 4.2l6 2.7 6-2.7V17l-6 3-6-3v-5.3z"/></svg>';

        const label = document.createElement('div');
        label.className = 'tracking-marker-label';
        label.textContent = kind === 'destination' ? 'Arrivee' : 'Colis';

        marker.appendChild(glyph);
        marker.appendChild(label);
        return marker;
      }

      function addMarker(position, kind, map) {
        if (!position) {
          return;
        }

        const marker = new AdvancedMarkerElement({
          position: position,
          title: String(arrivalAddress?.packageID || ''),
          content: buildTrackingMarkerContent(kind),
          map: map,
          zIndex: Math.round(position.lat * -100000) << 5,
        });
        markers.push(marker);
      }

      function removeAllMarkers() {
        for (let i = 0; i < markers.length; i += 1) {
          markers[i].setMap(null);
        }
        markers.splice(0, markers.length);
        clearRenderedRoute();
      }

      window.initMap = initMap;
      window.onmessage = (e) => {
        if (typeof e.data !== 'string') {
          return;
        }

        if (e.data.startsWith('TrackingPackage;')) {
          renderTrackingPackage(JSON.parse(e.data.substring('TrackingPackage;'.length)));
          return;
        }

        if (e.data.startsWith('PackageNewPosition;')) {
          updateTrackedPosition(JSON.parse(e.data.substring('PackageNewPosition;'.length)));
        }
      };
    </script>
    <style>
      html,
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
      }

      #container {
        height: 100%;
        display: flex;
        padding: 0;
      }

      #map {
        flex: auto;
        height: 100%;
      }

      .tracking-marker {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
        color: #ffffff;
        font-family: Arial, sans-serif;
        transform: translateY(-8px);
        white-space: nowrap;
      }

      .tracking-marker-package {
        background: linear-gradient(135deg, #ef7d32, #cf6320);
      }

      .tracking-marker-destination {
        background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
      }

      .tracking-marker-glyph {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      .tracking-marker-glyph svg {
        width: 14px;
        height: 14px;
        fill: #ffffff;
        display: block;
      }

      .tracking-marker-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="container" class="container-fluid">
      <div id="map" class="col-md-8"></div>
    </div>
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=<%= VUE_APP_GOOGLE_MAPS_KEY %>&callback=initMap&v=weekly&loading=async"
    ></script>
  </body>
</html>
