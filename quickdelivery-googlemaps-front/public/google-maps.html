	   let userID;

	   const ipAddress = '192.168.0.24:8082';
	   function initMap() {
          window.top.postMessage('StartLoading', '*');
          var url_string = window.location.href;
          var url = new URL(url_string);
          userID = url.searchParams.get("userID");
          directionsRenderer = new google.maps.DirectionsRenderer({
              suppressMarkers: false,
              polylineOptions:{strokeColor: '#525CEB'}
          });
          directionsService = new google.maps.DirectionsService();
          infowindow = new google.maps.InfoWindow(
              {
                  size: new google.maps.Size(150,50)
              });
          map = new google.maps.Map(document.getElementById("map"), {
              zoom: 13,
              disableDefaultUI: true,
              zoomControl: true,
              scaleControl: true,
              mapId: "PACKAGES_AROUND",
          });

          const transitLayer = new google.maps.TransitLayer();
          transitLayer.setMap(map);

          directionsRenderer.setMap(map);
          const control = document.getElementById("floating-panel");
          map.controls[google.maps.ControlPosition.TOP_CENTER].push(control);

      }
	  function calculateAndDisplayRouteForPackage(directionsService, directionsRenderer, packageStart, packageEnd) {
	        window.top.postMessage('StartLoading', '*');
			const start = packageStart;
			const end = packageEnd;
			const filterSipleDirection = (simpleDirection) => (
				simpleDirection.packageStart.lat === start.lat &&
				simpleDirection.packageStart.lng === start.lng &&
				simpleDirection.packageEnd.lat === end.lat &&
				simpleDirection.packageEnd.lng === end.lng
			);

			const filteredSimpleDirection = packagesSimpleDirection.filter(filterSipleDirection);

			if (filteredSimpleDirection.length > 0) {
				directionsRenderer.setDirections(filteredSimpleDirection[0].response);
			} else {
				const selectedMode = google.maps.DirectionsTravelMode.DRIVING;
				directionsService
					.route({
						origin: start,
						destination: end,
						travelMode: google.maps.TravelMode[selectedMode],
					})
					.then((response) => {
						directionsRenderer.setDirections(response);
						packagesSimpleDirection.push({ packageStart: start, packageEnd: end, response: response });
					})
					.catch((e) =>

					);
			}
			window.top.postMessage('EndLoading', '*');
		}

	  function calculateAndDisplayRouteForPackageOnMyRoad(directionsService, directionsRenderer, packageStart, packageEnd) {
			window.top.postMessage('StartLoading', '*');
			const start = packageStart;
			const end = packageEnd;
			const filterOnMyRoadDirection = (simpleDirection) => (
				simpleDirection.packageStart.lat === start.lat &&
				simpleDirection.packageStart.lng === start.lng &&
				simpleDirection.packageEnd.lat === end.lat &&
				simpleDirection.packageEnd.lng === end.lng
			);

			const filteredOnMyRoadDirection = packagesOnMyRoadDirection.filter(filterOnMyRoadDirection);

			if (filteredOnMyRoadDirection.length > 0) {
				directionsRenderer.setDirections(packagesOnMyRoadDirection[0].response);
			}else{
				const selectedMode = google.maps.DirectionsTravelMode.DRIVING;
				getPackagesOnMyRoad(packageStart, packageEnd)
					.then(waypts => {
						directionsService
							.route({
								origin: start,
								destination: end,
								waypoints: waypts,
								travelMode: google.maps.TravelMode[selectedMode],
							})
							.then((response) => {
								directionsRenderer.setDirections(response);
								packagesOnMyRoadDirection.push({ packageStart: start, packageEnd: end, response: response });
							})
							.catch((e) =>
								window.alert("Directions request failed due to " + status)
							);
					})
					.catch(error => {
						// Gérer les erreurs ici si nécessaire
						console.error(error);
					});
				}
			window.top.postMessage('EndLoading', '*');
		}

		async function getPackagesOnMyRoad(departurePosition, arrivalPosition) {
			return new Promise(async (resolve, reject) => {
				try {
					var xhr = new XMLHttpRequest();
					const waypts = [];
					var url = `https://${ipAddress}/packages/v1/packages-on-my-road?departureLatitude=${departurePosition.lat}&departureLongitude=${departurePosition.lng}&arrivalLatitude=${arrivalPosition.lat}&arrivalLongitude=${arrivalPosition.lng}`;
					xhr.open("GET", url, true);

					xhr.onload = function () {
						if (xhr.status >= 200 && xhr.status < 300) {
							packagesOnMyRoad = JSON.parse(xhr.responseText);
							packagesOnMyRoad.forEach(function (package_) {
								var addressToAdd;
								package_.addresses.forEach(function (adresse) {
									addressToAdd = { lat: adresse.latitude, lng: adresse.longitude };
									waypts.push({
										location: addressToAdd,
										stopover: true,
									});
								});
							});
							waypts.sort((a, b) => a.location.lat - b.location.lat);
							resolve(waypts);
						} else {
							console.error("Erreur de l'API :", xhr.statusText);
							reject(new Error(xhr.statusText));
						}
					};

					xhr.onerror = function () {
						console.error("Erreur de réseau lors de la requête vers l'API.");
						reject(new Error("Erreur de réseau lors de la requête vers l'API."));
					};

					xhr.send();
				} catch (error) {
					reject(error);
				}
			});
		}

		function addMarker(departureAddress, arrivalAddress, map) {
		  if(departureAddress != undefined){
				  var markerInfo;
				  if(arrivalAddress != undefined){
				    if(arrivalAddress.line2 != null){
					  markerInfo = `<p>${arrivalAddress.line1} ${arrivalAddress.line2} ${arrivalAddress.zipCode} ${arrivalAddress.town}</p>`;
					}else{
					  markerInfo = `<p>${arrivalAddress.line1} ${arrivalAddress.zipCode} ${arrivalAddress.town}</p>`;
					}

				  }

					var marker = new google.maps.Marker({
					  position: departureAddress,
					  title: arrivalAddress.packageID+"",
					  map:map,
					  zIndex: Math.round(departureAddress.lat*-100000)<<5
				  });
				  marker.myname = arrivalAddress.packageID;
				google.maps.event.addListener(marker, 'click', function() {
					infowindow.setContent(markerInfo);
					infowindow.open(map,marker);
					//window.top.postMessage("SelectedPackage:"+arrivalAddress.packageID, '*');
				});
				markers.push(marker);
			}
		}
      window.initMap = initMap;
      window.onmessage = (e) => {
        if (e.data && e.data.actuallongitude && e.data.actuallatitude) {
           initialLocation = new google.maps.LatLng(event.data.actuallatitude, event.data.actuallongitude);
           map.setCenter(initialLocation);
        }else if (Array.isArray(e.data)) {
          removeAllMarkers();
          const rawData = e.data;
          packagesArround = JSON.parse(JSON.stringify(rawData));
		  packagesArround.forEach(function(package_) {
		  	var arrivalAddress;
		  	var departureAddress;
		  	package_.addresses.forEach(function(adresse) {
		  		if(adresse.type === "ARRIVAL"){
		  			arrivalAddress = {packageID: package_.id,line1: adresse.line1, line2: adresse.line2, zipCode: adresse.zipCode, town: adresse.town, lat: adresse.latitude, lng: adresse.longitude};
		  		}else{
		  			departureAddress = {lat: adresse.latitude, lng: adresse.longitude};
		  		}
		  	});
			addMarker(departureAddress, arrivalAddress, map);
			});
        } else if (typeof e.data === 'string' && e.data.includes('SelectedDirection:')) {
			let dataArray = e.data.split(';');
			let departure = dataArray[0].split(':')[1];
			let arrival = dataArray[1];
			let departureArray = departure.split(',');
			let arrivalArray = arrival.split(',');
			let departurePosition = {lat: Number(departureArray[0]), lng: Number(departureArray[1])}
			let arrivalPosition = {lat: Number(arrivalArray[0]), lng: Number(arrivalArray[1])}
			calculateAndDisplayRouteForPackage(directionsService, directionsRenderer, departurePosition, arrivalPosition);
        }else if (typeof e.data === 'string' && e.data.includes('OnMyDirection:')) {
			let dataArray = e.data.split(';');
			let departure = dataArray[0].split(':')[1];
			let arrival = dataArray[1];
			let departureArray = departure.split(',');
			let arrivalArray = arrival.split(',');
			let departurePosition = {lat: Number(departureArray[0]), lng: Number(departureArray[1])}
			let arrivalPosition = {lat: Number(arrivalArray[0]), lng: Number(arrivalArray[1])}
			calculateAndDisplayRouteForPackageOnMyRoad(directionsService, directionsRenderer, departurePosition, arrivalPosition);
        }
      }
	  function refreshPackagesList(){
	    window.top.postMessage('StartLoading', '*');
		removeAllMarkers();
	    window.top.postMessage('EndLoading', '*');
	  }
	  function removeAllMarkers() {
		for (let i = 0; i < markers.length; i++) {
			markers[i].setMap(null);
		}
		markers.splice(0, markers.length);
	  }
