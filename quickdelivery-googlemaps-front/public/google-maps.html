							})

	  async function getPackagesAroundMe(latitude, longitude) {
			return new Promise(async (resolve, reject) => {	
				try{
					var xhr = new XMLHttpRequest();
					var url = `http://localhost:8082/packages/v1/packages-around?latitude=${latitude}&longitude=${longitude}&rayonEnMetres=20000`;
					xhr.open("GET", url, true);
					xhr.onload = function() {
						if (xhr.status >= 200 && xhr.status < 300) {
							packagesArround = JSON.parse(xhr.responseText);
							window.top.postMessage(packagesArround, '*');
							packagesArround.forEach(function(package_) {
								var arrivalAddress;
								var departureAddress;
								package_.addresses.forEach(function(adresse) {
									if(adresse.type === "ARRIVAL"){
										arrivalAddress = {packageID: package_.id,line1: adresse.line1, line2: adresse.line2, zipCode: adresse.zipCode, town: adresse.town, lat: adresse.latitude, lng: adresse.longitude};
									}else{
										departureAddress = {lat: adresse.latitude, lng: adresse.longitude};
									}
								});
								addMarker(departureAddress, arrivalAddress, map);
							});
						} else {
							console.error("Erreur de l'API :", xhr.statusText);
						}
					};
					xhr.onerror = function() {
						console.error("Erreur de réseau lors de la requête vers l'API.");
					};
					xhr.send();
				} catch (error) {
					reject(error);
				}
				});
		}
		async function getPackagesOnMyRoad(departurePosition, arrivalPosition) {
			return new Promise(async (resolve, reject) => {
				try {
					var xhr = new XMLHttpRequest();
					const waypts = [];
					var url = `http://localhost:8082/packages/v1/packages-on-my-road?departureLatitude=${departurePosition.lat}&departureLongitude=${departurePosition.lng}&arrivalLatitude=${arrivalPosition.lat}&arrivalLongitude=${arrivalPosition.lng}`;
					console.log(url);
					xhr.open("GET", url, true);

					xhr.onload = function () {
						if (xhr.status >= 200 && xhr.status < 300) {
							packagesOnMyRoad = JSON.parse(xhr.responseText);
							packagesOnMyRoad.forEach(function (package_) {
								var addressToAdd;
								package_.addresses.forEach(function (adresse) {
									addressToAdd = { lat: adresse.latitude, lng: adresse.longitude };
									waypts.push({
										location: addressToAdd,
										stopover: true,
									});
								});
							});
							waypts.sort((a, b) => a.location.lat - b.location.lat);
							resolve(waypts);
						} else {
							console.error("Erreur de l'API :", xhr.statusText);
							reject(new Error(xhr.statusText));
						}
					};

					xhr.onerror = function () {
						console.error("Erreur de réseau lors de la requête vers l'API.");
						reject(new Error("Erreur de réseau lors de la requête vers l'API."));
					};

					xhr.send();
				} catch (error) {
					reject(error);
				}
			});
		}

		function addMarker(departureAddress, arrivalAddress, map) {
		  if(departureAddress != undefined){
				  var markerInfo;
				  if(arrivalAddress != undefined){
					  markerInfo = `<p>${arrivalAddress.line1} ${arrivalAddress.line2} ${arrivalAddress.zipCode} ${arrivalAddress.town}</p><p><a href="#" onclick="calculateAndDisplayRouteForPackage(directionsService, directionsRenderer, {lat: ${departureAddress.lat}, lng: ${departureAddress.lng}}, {lat: ${arrivalAddress.lat}, lng: ${arrivalAddress.lng}})">Show direction</a></p><p><a href="#" onclick="calculateAndDisplayRouteForPackageOnMyRoad(directionsService, directionsRenderer, {lat: ${departureAddress.lat}, lng: ${departureAddress.lng}}, {lat: ${arrivalAddress.lat}, lng: ${arrivalAddress.lng}})">Show direction with packages on my road</a></p>`;
					  
				  }
				  
					var marker = new google.maps.Marker({
					  position: departureAddress,
					  title: arrivalAddress.packageID+"",
					  map:map,
					  zIndex: Math.round(departureAddress.lat*-100000)<<5
				  });
