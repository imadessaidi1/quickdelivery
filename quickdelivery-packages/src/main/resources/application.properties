spring.application.name=Package_Service
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://172.26.4.12:8889}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:configuser}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:configpass}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
management.metrics.tags.application=${spring.application.name}
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
spring.data.redis.repositories.enabled=false
spring.datasource.hikari.pool-name=${PACKAGES_DB_POOL_NAME:packages-hikari}
spring.datasource.hikari.minimum-idle=${PACKAGES_DB_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${PACKAGES_DB_MAX_POOL_SIZE:12}
spring.datasource.hikari.connection-timeout=${PACKAGES_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${PACKAGES_DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${PACKAGES_DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${PACKAGES_DB_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${PACKAGES_DB_KEEPALIVE_TIME_MS:300000}
quickdelivery.google-maps.connect-timeout-seconds=${PACKAGES_GOOGLE_MAPS_CONNECT_TIMEOUT_SECONDS:3}
quickdelivery.google-maps.read-timeout-seconds=${PACKAGES_GOOGLE_MAPS_READ_TIMEOUT_SECONDS:5}
quickdelivery.google-maps.write-timeout-seconds=${PACKAGES_GOOGLE_MAPS_WRITE_TIMEOUT_SECONDS:5}
quickdelivery.google-maps.query-rate-limit=${PACKAGES_GOOGLE_MAPS_QUERY_RATE_LIMIT:20}
quickdelivery.async.package.core-pool-size=${PACKAGES_ASYNC_PACKAGE_CORE_POOL_SIZE:2}
quickdelivery.async.package.max-pool-size=${PACKAGES_ASYNC_PACKAGE_MAX_POOL_SIZE:4}
quickdelivery.async.package.queue-capacity=${PACKAGES_ASYNC_PACKAGE_QUEUE_CAPACITY:100}
quickdelivery.async.mail.core-pool-size=${PACKAGES_ASYNC_MAIL_CORE_POOL_SIZE:2}
quickdelivery.async.mail.max-pool-size=${PACKAGES_ASYNC_MAIL_MAX_POOL_SIZE:4}
quickdelivery.async.mail.queue-capacity=${PACKAGES_ASYNC_MAIL_QUEUE_CAPACITY:100}
