spring.application.name=DISCOVERY-SERVER
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://172.26.4.12:8889}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:configuser}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:configpass}

# Safe local fallback if config-server is unavailable at startup
server.port=8080
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://172.26.4.12:8080/eureka/}
