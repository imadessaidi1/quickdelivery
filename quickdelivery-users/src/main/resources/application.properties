spring.application.name=users-service
spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://172.26.4.12:8889}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:configuser}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:configpass}
quickdelivery.ocr.textract.enabled=${QUICKDELIVERY_OCR_TEXTRACT_ENABLED:false}
quickdelivery.ocr.textract.region=${QUICKDELIVERY_OCR_TEXTRACT_REGION:eu-west-3}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
management.metrics.tags.application=${spring.application.name}
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
spring.datasource.hikari.pool-name=${USERS_DB_POOL_NAME:users-hikari}
spring.datasource.hikari.minimum-idle=${USERS_DB_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${USERS_DB_MAX_POOL_SIZE:12}
spring.datasource.hikari.connection-timeout=${USERS_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${USERS_DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${USERS_DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${USERS_DB_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${USERS_DB_KEEPALIVE_TIME_MS:300000}
quickdelivery.google-maps.connect-timeout-seconds=${USERS_GOOGLE_MAPS_CONNECT_TIMEOUT_SECONDS:3}
quickdelivery.google-maps.read-timeout-seconds=${USERS_GOOGLE_MAPS_READ_TIMEOUT_SECONDS:5}
quickdelivery.google-maps.write-timeout-seconds=${USERS_GOOGLE_MAPS_WRITE_TIMEOUT_SECONDS:5}
quickdelivery.google-maps.query-rate-limit=${USERS_GOOGLE_MAPS_QUERY_RATE_LIMIT:20}
quickdelivery.async.user.core-pool-size=${USERS_ASYNC_USER_CORE_POOL_SIZE:4}
quickdelivery.async.user.max-pool-size=${USERS_ASYNC_USER_MAX_POOL_SIZE:8}
quickdelivery.async.user.queue-capacity=${USERS_ASYNC_USER_QUEUE_CAPACITY:150}
quickdelivery.async.mail.core-pool-size=${USERS_ASYNC_MAIL_CORE_POOL_SIZE:2}
quickdelivery.async.mail.max-pool-size=${USERS_ASYNC_MAIL_MAX_POOL_SIZE:4}
quickdelivery.async.mail.queue-capacity=${USERS_ASYNC_MAIL_QUEUE_CAPACITY:100}
quickdelivery.async.ocr.core-pool-size=${USERS_ASYNC_OCR_CORE_POOL_SIZE:2}
quickdelivery.async.ocr.max-pool-size=${USERS_ASYNC_OCR_MAX_POOL_SIZE:4}
quickdelivery.async.ocr.queue-capacity=${USERS_ASYNC_OCR_QUEUE_CAPACITY:100}
